{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> INVOSPHERE-Tasty Pay | Ready to Serve and Bill</title>
  <link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/x-icon">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/mystyle.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark py-3" id="mainNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="{% static 'images/logo.png' %}" alt="Tasty Pay Logo" width="35" height="35" class="me-2">
        <span class="fw-bold"> INVOSPHERE-TASTY PAY</span>
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">ABOUT US</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'outlets' %}">OUTLETS</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">ADMIN</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero d-flex flex-column align-items-center justify-content-center text-center">
    <h1 class="display-4 mb-4 fw-bold text-danger welcome-text">
      Welcome!<br>
      <span class="sub-text">Ready to Serve<br>and Bill</span>
    </h1>

    <div class="food-icons my-4">
      <img src="{% static 'images/ramen.png' %}" alt="Ramen" class="food-img ramen">
      <img src="{% static 'images/burger.png' %}" alt="Burger" class="food-img burger">
      <img src="{% static 'images/pizza.png' %}" alt="Pizza" class="food-img pizza">
      <img src="{% static 'images/coffee.png' %}" alt="Coffee" class="food-img coffee">
    </div>
 
      <a href="{% url 'startbill' %}" class="btn btn-lg btn-start shadow">Start Billing</a>
  

    <!-- Admin Panel Button -->
    <a href="{% url 'adminpanel' %}" class="btn btn-lg btn-admin shadow mt-3">Admin Panel</a>

    <p class="tagline mt-4">Foodies Fantasy, Billing Made Easy!</p>
  </section>

  <!-- Footer -->
  <footer class="footer py-3 text-center">
    <div class="container">
      <a href="#" class="footer-link">T&C</a>
      <a href="#" class="footer-link">Privacy Policy</a>
      <a href="#" class="footer-link">Contact Us</a>
      <a href="#" class="footer-link">FAQ</a>
      <p class="mb-0 small text-muted">© 2025  INVOSPHERE</p>
    </div>
  </footer>

  <!-- Bootstrap JS + Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
