{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Pay | Admin Panel</title>

  <!-- Bootstrap & Animate.css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="{% static 'css/mystyle.css' %}">
  <img src="{% static 'images/logo.png' %}" alt="Tasty Pay Logo" width="35" height="35" class="me-2">
  <link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/x-icon">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      transition: all 0.3s ease-in-out;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .nav-bar {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>
<body>

<!-- 🔴 Admin Navbar -->
<nav class="navbar nav-bar py-3">
  <div class="container-fluid justify-content-between px-4">
    <h3 class="fw-bold">INVOSPHERE:Tasty Pay | Admin Panel</h3>
   <!-- <a href="{% url 'homepg' %}" class="btn btn-light fw-bold">🏠 Back to Home</a>-->
  </div>
</nav>

<!-- 🧭 Admin Panel Options -->
<div class="container my-5">
  <h2 class="text-center mb-5 fw-bold text-danger animate__animated animate__fadeInDown">Welcome, Sumit</h2>

  <div class="row justify-content-center g-4">
    <!-- 📊 Show Stats and Graphs -->
    <div class="col-md-5">
      <div class="card text-center border-0 shadow-lg animate__animated animate__fadeInLeft">
        <div class="card-body">
          <h4 class="card-title text-danger fw-bold mb-3">📊 Show Stats & Graphs</h4>
          <p class="card-text text-muted">Visualize billing trends, total revenue, and order summaries.</p>
          <a href="{% url 'adminstats' %}" class="btn btn-danger fw-bold">View Graphs</a>
        </div>
      </div>
    </div>

    <!-- 📁 Show Previous Data -->
    <div class="col-md-5">
      <div class="card text-center border-0 shadow-lg animate__animated animate__fadeInRight">
        <div class="card-body">
          <h4 class="card-title text-primary fw-bold mb-3">📁 Show Previous Data</h4>
          <p class="card-text text-muted">Access all stored billing records from your database.</p>
          <br>
          <a href="{% url 'adminpreviousdata' %}" class="btn btn-primary fw-bold">View Data</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ⚙️ Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
